services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: aalapraj/fest-backend:1.0.0
    environment:
      REGNO: "202401100100002"
      DB_HOST: db
      DB_NAME: festpass
      DB_USER: festpass
      DB_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: 1.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "82:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-backend

volumes:
  db-data:

networks:
  frontend-backend:
  backend-db:
